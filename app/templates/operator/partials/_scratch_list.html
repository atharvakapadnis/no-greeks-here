<section class="scratch-list">
  <h2>Scratches{% if scratch_label %} {{ scratch_label }}{% endif %}</h2>
  {% for horse in scratch_horses %}
  <form method="post" action="/operator/race/scratch" class="scratch-item{% if horse.scratched %} scratch-item--scratched{% endif %}">
    <input type="hidden" name="race_number" value="{{ scratch_race_number }}">
    <input type="hidden" name="horse_number" value="{{ horse.number }}">
    <label class="scratch-item__label">
      <input
        type="checkbox"
        class="scratch-item__checkbox"
        name="scratched"
        value="true"
        {% if horse.scratched %}checked{% endif %}
        onchange="this.form.submit()"
      >
      #{{ horse.number }}{% if horse.name %} {{ horse.name }}{% endif %}
    </label>
  </form>
  {% endfor %}
</section>
