<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}no-greeks-here{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
<script src="/static/app.js"></script>
</head>
<body>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  {% if guest %}
  <nav class="tabbar">
    <a class="tabbar__tab{% if active_tab == 'bet' %} tabbar__tab--active{% endif %}" href="/bet"{% if active_tab == 'bet' %} aria-current="page"{% endif %}>Bet</a>
    <a class="tabbar__tab{% if active_tab == 'leaderboard' %} tabbar__tab--active{% endif %}" href="/leaderboard"{% if active_tab == 'leaderboard' %} aria-current="page"{% endif %}>Leaderboard</a>
  </nav>
  {% endif %}
</body>
</html>
