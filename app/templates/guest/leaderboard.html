{% extends "base.html" %}
{% block title %}Leaderboard{% endblock %}
{% block content %}
<div class="leaderboard">
  <h1 class="leaderboard__title">Leaderboard</h1>
  <!--
    Step 5 replaces this fixed-interval poll with SSE: a persistent push
    connection, visibility-change resync (refetch + reopen the stream when the
    phone unlocks), a 15s heartbeat with a "reconnecting" state after 30s of
    silence, and this same polling loop kept only as the fallback when SSE
    can't be established.
  -->
  <div id="leaderboard-table" hx-get="/leaderboard/table" hx-trigger="every 3s" hx-swap="innerHTML">
    {% include "guest/partials/leaderboard_table.html" %}
  </div>
</div>
{% endblock %}
